# Builds the downloads for a version tag (M20, D55) and puts them on a
# DRAFT GitHub release: nothing is public until someone presses Publish on
# the release page. Push a tag like v0.75 to start it; the tag must match
# the version the game prints with -version.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the draft release and upload the files

jobs:
  check:
    # The same checks as CI, on both systems, before anything is built.
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi
      - run: go test ./...

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: The tag matches the game's version
        run: |
          line="$(go run . -version)"
          echo "$line"
          case "$line" in
            "termfps ${GITHUB_REF_NAME} "*) ;;
            *) echo "tag ${GITHUB_REF_NAME} doesn't match: $line"; exit 1 ;;
          esac
      - name: Build the downloads
        # No cgo anywhere: oto plays sound through purego (Windows) and
        # PulseAudio (Linux) in pure Go, so every build is a cross-compile.
        run: |
          set -e
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            name="termfps-${GITHUB_REF_NAME}-${os}-${arch}"
            mkdir -p "build/$name"
            exe=termfps; [ "$os" = windows ] && exe=termfps.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w" -o "build/$name/$exe" .
            cp README.md LICENSE THIRD_PARTY_NOTICES.txt "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          title="termfps $(go run . -version | cut -d' ' -f2-)"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --prerelease --title "$title" --notes-file "$notes"
